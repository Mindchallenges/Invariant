id: loose
description: >
  Observation mode. Nothing blocks except the two failures that cannot be
  undone after the fact — an edit in the shared checkout and personal data
  heading into a commit. Everything else is recorded and reported, so a project
  can adopt the library, watch what it would have said for a while, and tighten
  from evidence rather than from guesswork.

rules:
  session.isolated_before_edit: warn
  session.no_edit_in_main_checkout: block
  session.push_barrier: warn
  session.push_enabled: warn
  session.ff_merge_target: warn
  session.own_file_set_only: warn
  session.work_would_be_stranded: "off"
  session.deliverables_complete: warn
  session.branch_is_current: warn
  session.named_after_isolating: "off"
  session.teardown_complete: "off"

  pipeline.complete: warn
  pipeline.started_before_edit: warn

  agents.design_agent_ran: warn
  agents.review_agent_ran: warn
  # Said before a design or review agent is dispatched with no pipeline to
  # record it (IDEA_020). Warn everywhere: the dispatch is legitimate.
  agents.gated_dispatch_has_pipeline: warn

  docs.read_architecture: warn
  docs.updated: warn
  docs.diagrams_current: "off"

  test.new_test_fails: warn
  test.all_pass: warn
  coverage.meets_floor: "off"
  # A whole-suite or whole-scheme run on a change, under a sweep cadence
  # (ADR-010 D5). N/A without one. Warns: a full run costs time, never passes
  # anything it should not; a project that rules "never" sets block.
  sweep.no_full_run: warn

  privacy.clean: block

  memory.schema_valid: warn
  memory.index_current: warn
  memory.no_dead_links: "off"
  memory.no_duplicates: "off"

  item.bug_reproduced_before_fix: warn
  item.residue_matches_status: "off"
  item.history_matches_status: warn
