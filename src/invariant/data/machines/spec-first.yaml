id: spec-first
kind: pipeline
description: >
  For design-heavy work where the specification is the deliverable and the
  implementation follows it rather than discovering it.

initial: designing
terminal: [committed, abandoned]

# Every gate here is written as a precondition of the state it guards, so that
# the backward edges this methodology declares — and it declares one out of
# almost every state — are actually walkable (BUG_037).

states:
  designing:
    description: Understand the problem against the architecture docs.
    roles: [design]
    next: [specified, abandoned]
  specified:
    description: A written spec exists and has been reviewed.
    next: [implementing, designing, abandoned]
  implementing:
    # A spec that has been written down is what implementing follows. Held
    # here rather than on `specified`'s exit so that `specified -> designing`,
    # going back because the spec turned out to be wrong, is not gated by the
    # spec being finished.
    entry_gates: [docs.updated]
    next: [reviewing, specified, abandoned]
  reviewing:
    roles: [review]
    entry_gates: [test.all_pass]
    next: [committed, implementing, abandoned]
  committed:
    roles: [landing]
    entry_gates: [test.all_pass, coverage.meets_floor, privacy.clean]
  abandoned:
    description: The work was dropped. Reaching it is deliberately ungated.
    roles: [abandon]
