id: session
kind: session
description: >
  A unit of agent work with an identity and an isolated worktree. The edges are
  ordered the way they are so that nothing irreversible happens before
  something reviewable has.

  A session ends at the merge: the worktree and its branch are removed and the
  work lives on the base branch. Publishing that branch is a separate decision
  with a separate cost, so `pushed` is a detour rather than a step, reachable
  only where `session.push` is enabled.

initial: registered
terminal: [torn_down, abandoned]

states:
  registered:
    description: The session exists and is named, but owns no worktree yet.
    next: [isolated, abandoned]
  isolated:
    description: A worktree and branch exist and belong to this session.
    entry_gates: [session.named_after_isolating]
    next: [working, abandoned]
  working:
    description: Edits and local commits. Commits are cheap; keep them granular.
    next: [working, reviewed, abandoned]
  reviewed:
    description: The review gates have passed against the declared file set.
    # The methodology must have run to its end. Every gate a pipeline owns is
    # an EXIT gate on one of its states, so a session that never advanced its
    # pipeline skipped all of them rather than passing them — which is exactly
    # how work reached `torn_down` with the pipeline still in `designing`.
    entry_gates: [pipeline.complete]
    exit_gates: [privacy.clean]
    next: [merged, working, abandoned]
  merged:
    description: Rebased and fast-forward merged into the base branch.
    # Repeated here deliberately. `reviewed` can be re-entered from `working`,
    # and the merge is the irreversible step; a gate that only guards the
    # reviewable step guards nothing once the work moves on from it.
    entry_gates: [session.ff_merge_target, pipeline.complete]
    next: [torn_down, pushed, abandoned]
  pushed:
    description: >
      The single push has happened. Only reachable where session.push is on;
      the gate, not the graph, is what holds that, so turning it on needs no
      change to the machine.
    entry_gates: [session.push_enabled, session.push_barrier]
    next: [torn_down]
  torn_down:
    description: Worktree and branch removed, session deregistered.
  abandoned:
    description: Ended without merging. The record is kept as evidence.
