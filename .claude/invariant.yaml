version: 1

# The library's own manifest. ADR-001's closing note says "a control the
# library will not run against itself is a control it should not ship", and
# until now that was aspiration: there was no manifest here, so none of it ran.

project:
  name: invariant
  ecosystems: [python]

paths:
  docs: docs/architecture
  memory: .claude/memory
  memory_index: MEMORY.md

docs:
  format: markdown
  diagrams: mermaid

items:
  backend: markdown
  path: docs/backlog
  # An ADDITIONAL project prefix, if a repo wants one (e.g. "HEAP_"). The item
  # type already contributes its own stem, so setting "BUG_" here mints
  # BUG_BUG_001 — which is what it did on the first attempt.
  id_prefix: ""

methodology:
  pipeline: tdd
  gates:
    coverage_min: 85
    coverage_scope: touched

enforcement:
  # Deliberately NOT strict. This repository is the one place where a gate
  # failing is as likely to be a defect in the gate as in the work, and a
  # blocking rule here can wedge the tool that would fix it.
  profile: standard
  rules:
    # The library's own suite is green, but its coverage floor is a target
    # rather than a fact on every file. Advisory until it is.
    coverage.meets_floor: warn

    # The exception to "deliberately not strict" above. Coding is done through
    # the agents and the pipeline is always followed — that rule holds here
    # too, and a library that will not run its own control has no business
    # shipping it (ADR-001's closing note, applied to itself).
    #
    # The wedge hazard this block warns about is real here in a specific way:
    # a pipeline in this repository is driven from a host session whose project
    # root is a different repository, so an agent dispatched for this work may
    # not be recorded against this pipeline at all. If that wedges, the defect
    # is in the recording and gets fixed there. It is not a reason to lower the
    # gate — a gate lowered the first time it is inconvenient was never a gate.
    agents.design_agent_ran: block
    agents.review_agent_ran: block

session:
  exempt_paths:
    - ".claude/*"
    - ".claude/**"
    - "MEMORY.md"
  # Worktrees live inside the repository so the host trusts the directory it
  # already manages and stops confirming every entry. Safe here for the reason
  # d160d40 records: a path inside a linked worktree resolves against that
  # worktree, so the `.claude/*` exemptions above cannot swallow its sources.
  worktree_dir: ".claude/worktrees"
  # A session here does not publish; see ADR-001 D18.
  push: false

commands:
  # The python adapter defaults this to a bare `ruff check .`, which needs ruff
  # on PATH. It is not, so the gate could not run at all and five sessions in a
  # row recorded "lint NOT RUN" and moved on — a control nobody could execute
  # is worse than one that is absent, because its silence reads as a pass.
  # `uv run` resolves it from the dev group, where uv.lock pins the version.
  lint: uv run ruff check .

privacy:
  enabled: true
  patterns: [home_paths, emails, ip_addresses, tokens, clock_times, links]
  scope: [docs, memory, commit_messages]

memory:
  managed: false
