# invariant's own guidelines ruleset (ADR-012 D3, IDEA_031 A3 increment 9).
# The checklist beside it is generated: edit this file, then run
# `invariant guidelines render`.
version: 1
sections:
  - id: layers
    title: Layering
  - id: conduct
    title: Agent conduct
  - id: docs
    title: Design records
rules:
  - id: layers.only-the-cli-imports-the-oracle
    section: layers
    title: Only the CLI imports the oracle
    statement: >
      No module under core, domains, adapters or hosts imports anything from
      the oracle. The arrows into the oracle come from the CLI alone, so the
      engine works identically whether or not the oracle is ever used, and a
      host only says what happened while the CLI writes the sidecar.
    severity: blocker
    phases: [design, review, landing]
    applies_to:
      - src/invariant/core/*.py
      - src/invariant/domains/*.py
      - src/invariant/adapters/*.py
      - src/invariant/hosts/*.py
    check:
      kind: boundary
      engine: imports
      forbid: ["src/invariant/oracle/*"]
    rationale: >
      To fix a finding, move the call up into the CLI, which may import the
      oracle, and hand what the lower layer needs down to it as a value or a
      callable. docs/architecture/overview.rst draws every arrow into oracle/
      from the CLI, and ADR-007 D6 is why there is no hosts-to-oracle arrow.
    links:
      - docs/architecture/overview.rst
      - DEC_ADR_007_D6
  - id: layers.oracle-never-imports-hosts
    section: layers
    title: The oracle never imports a host
    statement: >
      No module under oracle imports anything from hosts. Host facts and
      effects reach the oracle through a protocol the oracle defines and the
      CLI injects an implementation of.
    severity: blocker
    phases: [design, review, landing]
    applies_to:
      - src/invariant/oracle/*.py
    check:
      kind: boundary
      engine: imports
      forbid: ["src/invariant/hosts/*"]
    rationale: >
      To fix a finding, define the shape the oracle reads (as HostProbe and
      HostSeams are), implement it in hosts, and have the CLI inject it.
      docs/architecture/overview.rst records that no oracle-to-hosts arrow
      exists, and ADR-007 D11 is the probe the CLI injects.
    links:
      - docs/architecture/overview.rst
      - DEC_ADR_007_D11
  - id: conduct.interview-when-input-is-needed
    section: conduct
    title: Interview the user when their input is needed
    statement: >
      When a decision is genuinely the user's, and neither the request, the
      code, the architecture docs, the design system nor a sensible default
      settles it, interview the user: a focused round of questions with
      concrete options, repeated until the answer is clear. Do not guess the
      answer, and do not stop with a vague hand-back in place of the
      questions. A decision that can be inferred is made and stated, not
      asked.
    severity: warn
    phases: [always]
    applies_to:
      - CLAUDE.md
      - .claude/agents/*.md
      - src/invariant/data/agents/*.md
      - src/invariant/data/skills/**
    check:
      kind: judgement
      evidence: citation
      scope: diff
      not_applicable_when:
        - id: asking-unchanged
          claim: The change does not alter when or how an agent asks the user for input.
    rationale: >
      To fix a finding, make the agent's instructions name the interview
      round (an INTERVIEW block, or a multiple-choice question where the host
      offers one) at the point where it would otherwise guess or bail. The
      user asked for this on 2026-11-08; the backlog-curator's INTERVIEW
      relay and feature-architect's STOP reports are the existing shapes.
    links:
      - .claude/agents/backlog-curator.md
      - .claude/agents/feature-architect.md
  - id: docs.items-carry-no-design
    section: docs
    title: Work items carry no design
    statement: >
      An item holds the problem, the evidence and the status; a ruling or
      design in it is a decision need linked by id.
    severity: warn
    phases: [review]
    applies_to:
      - docs/backlog.rst
    check:
      kind: judgement
      evidence: citation
      scope: diff
    rationale: >
      To fix a finding, write the ruling or the design as a decision need
      (invariant docs decision new) and leave only its id in the item.
      items.decisions_linked checks mechanically that every id an item names
      is a need the build holds; the prose around the ids is this rule's.
  - id: docs.decisions-are-declared
    section: docs
    title: Every decision a session made is declared
    statement: >
      A decision a session makes is declared with `invariant session
      decisions add`, as the id of its need or as a draft that becomes one,
      before the session lands. A decision written only in an agent report,
      a plan or a commit message is not recorded.
    severity: warn
    phases: [review]
    applies_to: ["**"]
    check:
      kind: judgement
      evidence: citation
      scope: diff
    rationale: >
      To fix a finding, declare each undeclared decision (invariant session
      decisions add) and write it as a need. docs.decisions_recorded holds
      the declared ones at the landing; a decision nobody declared is
      visible only to this review.
