[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant"
version = "0.1.0"
description = "Deterministic, scripted state for agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agents", "workflow", "state-machine", "claude-code"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# The oracle's dashboard, `invariant oracle tui` (IDEA_012, ADR-007 D19). An
# extra, so the core install stays PyYAML-only: everything else the oracle
# does — the index, the scan, the watcher, notifications, the LaunchAgent —
# needs nothing beyond the standard library.
oracle = ["textual>=8.0"]

[project.urls]
Homepage = "https://github.com/Mindchallenges/invariant"
Repository = "https://github.com/Mindchallenges/invariant"
Issues = "https://github.com/Mindchallenges/invariant/issues"
Documentation = "https://github.com/Mindchallenges/invariant/tree/main/docs/guide"

[project.scripts]
invariant = "invariant.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invariant"]

[tool.hatch.build.targets.sdist]
include = ["src/invariant", "docs", "tests", "README.md"]

[dependency-groups]
# ruff is declared here rather than left to `uvx` so the lint gate is
# reproducible: uv.lock pins the version, and a floating one would move the
# baseline under the gate without anyone changing a line of source.
#
# textual is here as well as in the `oracle` extra so the suite always runs
# the dashboard's tests rather than skipping them, and uv.lock pins it for the
# same reason: a floating TUI toolkit would move what those tests measure.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16", "textual>=8.0"]
# Sphinx renders docs/ (architecture docs, ADRs, audit reports) as one site.
# Pinned through uv.lock for the same reason ruff is: a floating doc toolchain
# moves the build baseline without anyone changing a line of source.
docs = ["sphinx>=8.0", "myst-parser>=4.0", "sphinxcontrib-mermaid>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/invariant"]
branch = true
